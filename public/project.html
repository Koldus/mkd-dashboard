<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Workspace</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <a href="/" class="header-back">&#8592;</a>
      <div class="project-switcher" id="project-switcher">
        <button class="project-switcher-trigger" id="project-switcher-btn">
          <span class="header-title" id="project-title">Project</span>
          <span class="project-switcher-caret" id="project-switcher-caret">&#x25BE;</span>
        </button>
        <div class="project-switcher-dropdown" id="project-switcher-dropdown" hidden></div>
      </div>
    </div>
    <div class="header-right">
      <span class="header-date" id="header-date"></span>
      <a href="/editor.html?root=notebook" class="header-link" data-feature="notebook">Notebook</a>
      <a href="/links.html" class="header-link">Links</a>
    </div>
  </header>

  <!-- Task modal -->
  <div class="modal-overlay" id="task-modal-overlay">
    <div class="modal">
      <div class="modal-title" id="task-modal-title">New Task</div>
      <div class="modal-body">
        <label class="modal-field">
          <span class="modal-label">Task</span>
          <input type="text" id="task-modal-name" class="modal-input" placeholder="Task name" autocomplete="off" />
        </label>
        <label class="modal-field">
          <span class="modal-label">Status</span>
          <select id="task-modal-status" class="modal-input">
            <option>Backlog</option>
            <option>Plan soon</option>
            <option>This Week</option>
            <option>Today</option>
            <option>In progress</option>
            <option>On Hold</option>
            <option>Done</option>
          </select>
        </label>
        <label class="modal-field">
          <span class="modal-label">Project</span>
          <select id="task-modal-project" class="modal-input">
            <option value="">&mdash; none &mdash;</option>
          </select>
        </label>
        <div class="modal-field">
          <span class="modal-label">Activity</span>
          <div class="modal-pills" id="task-modal-activity"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-danger" id="task-modal-delete" hidden>Delete</button>
        <button class="modal-btn" id="task-modal-cancel">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="task-modal-submit">Save</button>
      </div>
    </div>
  </div>

  <script>
    let wsActivityTypes = [];
    window.wsFeaturesReady = fetch('/api/workspace').then(r => r.json()).then(ws => {
      const features = new Set(ws.features);
      document.querySelectorAll('[data-feature]').forEach(el => {
        if (!features.has(el.dataset.feature)) el.style.display = 'none';
      });
      document.title = document.title.replace('Workspace', ws.name);
      wsActivityTypes = ws.activityTypes || [];
      return features;
    });
  </script>

  <main class="project-layout">

    <!-- Left sidebar: files + tasks stacked -->
    <aside class="project-sidebar" id="project-sidebar">

      <div class="proj-panel" id="files-panel">
        <div class="proj-panel-header">
          Files
          <div style="display:flex;gap:3px;">
            <button class="proj-panel-action" id="file-add-btn" title="New file">+</button>
            <button class="proj-panel-action" id="folder-add-btn" title="New folder">⊕</button>
          </div>
        </div>
        <div class="files-tab-bar" id="files-tabs" hidden>
          <button class="files-tab active" data-tab="project">Project</button>
          <button class="files-tab" data-tab="worktree">Worktree</button>
        </div>
        <nav class="proj-panel-body" id="file-nav"></nav>
        <nav class="proj-panel-body" id="worktree-nav" hidden></nav>
        <div class="proj-new-file" id="new-file-row" hidden>
          <input class="proj-new-file-input" id="new-file-input" placeholder="filename" autocomplete="off" spellcheck="false" />
        </div>
        <div class="proj-new-file" id="new-folder-row" hidden>
          <input class="proj-new-file-input" id="new-folder-input" placeholder="folder-name" autocomplete="off" spellcheck="false" />
        </div>
      </div>

    </aside>

    <!-- Vertical resize handle between sidebar and editor -->
    <div class="proj-vresize" id="col-resize"></div>

    <!-- Right: tabbed editor -->
    <div class="project-editor">
      <div class="editor-tabs" id="editor-tabs">
        <span class="editor-tabs-empty" id="editor-tabs-empty">No file open</span>
      </div>
      <div class="editor-content" id="editor-content">
        <div class="editor-empty-state" id="editor-empty">
          <p>Select a file to view it.</p>
        </div>
      </div>
    </div>

  </main>

  <script type="module">
    import { initEditor, setupTuiPane, humanize } from './editor-core.js';
    import { renderKanbanBoard } from './kanban.js';

    const wsFeatures = await window.wsFeaturesReady;

    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const params      = new URLSearchParams(location.search);
    const root        = params.get('root') || 'projects';
    const projectPath = params.get('path') || '';
    const initialFile = params.get('file') || null;

    const titleSource = projectPath ? projectPath.split('/').pop() : root;
    const pageTitle   = humanize(titleSource);
    document.getElementById('project-title').textContent = pageTitle;
    document.title = `${pageTitle} — Workspace`;

    // ── Project switcher ──────────────────────────────────────────────────────
    const switcherBtn      = document.getElementById('project-switcher-btn');
    const switcherDropdown = document.getElementById('project-switcher-dropdown');
    const switcherCaret    = document.getElementById('project-switcher-caret');

    function closeSwitcher() {
      switcherDropdown.hidden = true;
      switcherCaret.classList.remove('open');
    }

    function f1DotClass(metaStatus) {
      const s = (metaStatus || '').toLowerCase();
      if (s === 'in progress' || s === 'active') return 'active';
      if (s === 'shaping') return 'backlog';
      if (s === 'done') return 'done';
      return 'on-hold';
    }

    function attachSwitcherEvents() {
      switcherBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = !switcherDropdown.hidden;
        switcherDropdown.hidden = isOpen;
        switcherCaret.classList.toggle('open', !isOpen);
      });
      document.addEventListener('click', closeSwitcher);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSwitcher(); });
    }

    if (root === 'f1') {
      fetch('/api/f1/projects')
        .then(r => r.json())
        .then(projects => {
          let html = '';
          for (const p of projects) {
            const isCurrent = p.path === projectPath;
            const slug = f1DotClass(p.meta?.status);
            html +=
              `<a class="psd-item${isCurrent ? ' current' : ''}" ` +
              `href="/project.html?root=f1&path=${encodeURIComponent(p.path)}">` +
              `<span class="status-dot status-${slug}"></span>` +
              `<span>${p.name}</span>` +
              `</a>`;
          }
          switcherDropdown.innerHTML = html;
          attachSwitcherEvents();
        });
    } else {
      fetch('/api/projects')
        .then(r => r.json())
        .then(projects => {
          const categories = {};
          for (const p of projects) {
            if (!categories[p.category]) categories[p.category] = [];
            categories[p.category].push(p);
          }

          const toFolder    = p => p.replace(/\/[^/]+\.md$/i, '').replace(/\.md$/i, '');
          const currentFolder = projectPath;

          let html = '';
          for (const [cat, items] of Object.entries(categories)) {
            html += `<div class="psd-group-title">${cat}</div>`;
            for (const p of items) {
              const folder    = toFolder(p.path);
              const isCurrent = folder === currentFolder;
              const slug      = (p.status || '').toLowerCase().replace(/\s+/g, '-');
              html +=
                `<a class="psd-item${isCurrent ? ' current' : ''}" ` +
                `href="/project.html?path=${encodeURIComponent(folder)}">` +
                `<span class="status-dot status-${slug}"></span>` +
                `<span>${p.name}</span>` +
                `</a>`;
            }
          }
          switcherDropdown.innerHTML = html;
          attachSwitcherEvents();
        });
    }

    // ── README widget helpers ───────────────────────────────────────────────────
    let readmeDoc      = null;
    let sectionHtmlMap = {};

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    function domain(url) {
      try { return new URL(url).hostname; } catch { return url; }
    }

    const LINK_SECTIONS    = new Set(['Documentation', 'Links & Resources', 'Shopping List']);
    const STATUS_VALUES    = ['active', 'on hold', 'paused', 'backlog', 'done'];
    // Must match the section heading in README_TEMPLATE_WORK / _HOME (server.js).
    const CHECKLIST_SECTION = 'Project Checklist';

    function getReadmeStatus() {
      for (const line of readmeDoc.headerLines) {
        const m = line.match(/^\*\*Status:\*\*\s*(.+)/);
        if (m) return m[1].trim();
      }
      return '';
    }

    function setReadmeStatus(newStatus) {
      for (let i = 0; i < readmeDoc.headerLines.length; i++) {
        if (readmeDoc.headerLines[i].match(/^\*\*Status:\*\*/)) {
          readmeDoc.headerLines[i] = `**Status:** ${newStatus}`;
          return;
        }
      }
    }

    // ── Worktree README helpers ─────────────────────────────────────────────
    function getWorktreePath() {
      if (!readmeDoc) return '';
      for (const line of readmeDoc.headerLines) {
        const m = line.match(/^\*\*Worktree:\*\*\s*(.+)/);
        if (m) return m[1].trim();
      }
      return '';
    }

    function getWorktreeF1Path() {
      if (!readmeDoc) return '';
      for (const line of readmeDoc.headerLines) {
        const m = line.match(/^\*\*F1 Path:\*\*\s*(.+)/);
        if (m) return m[1].trim();
      }
      return '';
    }

    function setWorktreeConnection(wtPath, f1path) {
      let foundPath = false, foundF1 = false;
      for (let i = 0; i < readmeDoc.headerLines.length; i++) {
        if (readmeDoc.headerLines[i].match(/^\*\*Worktree:\*\*/)) {
          readmeDoc.headerLines[i] = `**Worktree:** ${wtPath}`;
          foundPath = true;
        }
        if (readmeDoc.headerLines[i].match(/^\*\*F1 Path:\*\*/)) {
          readmeDoc.headerLines[i] = `**F1 Path:** ${f1path}`;
          foundF1 = true;
        }
      }
      if (!foundPath) readmeDoc.headerLines.push(`**Worktree:** ${wtPath}`);
      if (!foundF1)   readmeDoc.headerLines.push(`**F1 Path:** ${f1path}`);
    }

    // ── Conversations widget (Slack tracker) ────────────────────────────────
    // Keep in sync with the same maps in index.html.
    const CONV_TYPE_LABELS   = { question: 'Question', reference: 'Reference', 'customer-request': 'Customer Request', idea: 'Idea' };
    const CONV_STATUS_LABELS = { unanswered: 'Unanswered', answered: 'Answered', saved: 'Saved', dismissed: 'Dismissed', open: 'Open' };

    async function loadConversations() {
      const r = await fetch('/api/conversations');
      if (!r.ok) return [];
      return r.json();
    }

    // Patches one entry server-side rather than rewriting the whole array from a page that
    // may have loaded minutes ago — /slack-inbox writes the same file.
    async function patchConversation(id, patch) {
      await fetch(`/api/conversations/${encodeURIComponent(id)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
    }

    function conversationActions(entry) {
      if (entry.type === 'idea') {
        if (entry.status === 'dismissed') return [{ label: 'Restore', next: 'open' }];
        if (entry.status === 'saved')     return [{ label: 'Reopen', next: 'open' }, { label: 'Dismiss', next: 'dismissed' }];
        return [{ label: 'Done', next: 'saved' }, { label: 'Dismiss', next: 'dismissed' }];
      }
      if (entry.type === 'reference') {
        return entry.status === 'dismissed'
          ? [{ label: 'Restore', next: 'saved' }]
          : [{ label: 'Dismiss', next: 'dismissed' }];
      }
      if (entry.status === 'unanswered') return [{ label: 'Mark answered', next: 'answered' }, { label: 'Dismiss', next: 'dismissed' }];
      if (entry.status === 'answered')   return [{ label: 'Reopen', next: 'unanswered' }, { label: 'Dismiss', next: 'dismissed' }];
      return [{ label: 'Restore', next: 'unanswered' }];
    }

    function conversationRowHTML(entry) {
      return `<li class="conv-row" data-id="${esc(entry.id)}">` +
        `<div class="conv-row-main">` +
        `<div class="conv-row-badges">` +
        `<span class="conv-badge conv-type-${esc(entry.type)}">${esc(CONV_TYPE_LABELS[entry.type] || entry.type)}</span>` +
        `<span class="conv-badge conv-status-${esc(entry.status)}">${esc(CONV_STATUS_LABELS[entry.status] || entry.status)}</span>` +
        `</div>` +
        `<a class="conv-excerpt" href="${esc(entry.permalink || '#')}" target="_blank" rel="noopener noreferrer">${esc(entry.excerpt || '(no excerpt)')}</a>` +
        `<div class="conv-meta">${esc(entry.channel || '')}${entry.author ? ' · ' + esc(entry.author) : ''}` +
        `${entry.source === 'inbox' ? ' · filed' : ''}</div>` +
        (entry.draftResponse
          ? `<div class="conv-draft"><div class="conv-draft-label">Drafted response</div>` +
            `<div class="conv-draft-text">${esc(entry.draftResponse)}</div>` +
            `<button class="conv-copy-btn" data-copy="${esc(entry.draftResponse)}">Copy</button></div>`
          : '') +
        // Read-only: captureNote belongs to /slack-inbox, which rewrites it on every re-file.
        (entry.captureNote
          ? `<div class="conv-note"><div class="conv-note-label">Filed with</div>` +
            `<div class="conv-note-text">${esc(entry.captureNote)}</div></div>`
          : '') +
        (entry.notes
          ? `<div class="conv-note"><div class="conv-note-label">Notes</div>` +
            `<div class="conv-note-text">${esc(entry.notes)}</div></div>`
          : '') +
        `<div class="conv-notes-edit" hidden>` +
        `<textarea class="conv-notes-textarea">${esc(entry.notes || '')}</textarea>` +
        `<div class="conv-notes-actions">` +
        `<button class="link-save-btn">Save</button><button class="link-cancel-btn">Cancel</button>` +
        `</div></div>` +
        `</div>` +
        `<div class="conv-row-actions">` +
        `<button class="links-action-btn conv-notes-btn">${entry.notes ? 'Edit notes' : 'Notes'}</button>` +
        conversationActions(entry).map(a => `<button class="links-action-btn" data-id="${esc(entry.id)}" data-next="${esc(a.next)}">${esc(a.label)}</button>`).join('') +
        `</div></li>`;
    }

    async function renderConversationsWidget(widget, projPath) {
      widget.innerHTML = `<div class="readme-widget-header">Conversations</div><div class="readme-widget-body conv-body">Loading…</div>`;
      const all = await loadConversations();
      const items = all
        .filter(c => c.projectPath === projPath)
        .sort((a, b) => (b.lastUpdated || '').localeCompare(a.lastUpdated || ''));

      const body = widget.querySelector('.conv-body');
      body.innerHTML = items.length
        ? `<ul class="conv-list">${items.map(conversationRowHTML).join('')}</ul>`
        : `<p class="proj-empty">No tracked conversations yet.</p>`;

      body.querySelectorAll('.conv-row-actions [data-next]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await patchConversation(btn.dataset.id, { status: btn.dataset.next });
          renderConversationsWidget(widget, projPath);
        });
      });

      body.querySelectorAll('.conv-copy-btn').forEach(btn => {
        btn.addEventListener('click', () => navigator.clipboard.writeText(btn.dataset.copy));
      });

      body.querySelectorAll('.conv-row').forEach(row => {
        const editor = row.querySelector('.conv-notes-edit');
        row.querySelector('.conv-notes-btn').addEventListener('click', () => {
          editor.hidden = !editor.hidden;
          if (!editor.hidden) editor.querySelector('textarea').focus();
        });
        editor.querySelector('.link-save-btn').addEventListener('click', async () => {
          await patchConversation(row.dataset.id, { notes: editor.querySelector('textarea').value.trim() });
          renderConversationsWidget(widget, projPath);
        });
        editor.querySelector('.link-cancel-btn').addEventListener('click', () => {
          editor.hidden = true;
        });
      });
    }

    function renderWorktreeWidget(widget, pane) {
      const wtPath   = getWorktreePath();
      const wtF1Path = getWorktreeF1Path();
      const wtName   = wtPath ? wtPath.split('/').pop() : '';
      widget.innerHTML =
        `<div class="readme-widget-header">Worktree</div>` +
        `<div class="readme-wt-body" id="wt-widget-body">` +
        (wtPath
          ? `<div class="readme-wt-connected">` +
            `<span class="readme-wt-name">${esc(wtName)}</span>` +
            `<span class="readme-wt-f1path">${esc(wtF1Path)}</span>` +
            `<button class="readme-wt-btn" id="wt-change-btn">Change</button>` +
            `</div>`
          : `<button class="readme-wt-btn" id="wt-connect-btn">Connect worktree…</button>`
        ) +
        `</div>`;
      const actionBtn = widget.querySelector('#wt-connect-btn, #wt-change-btn');
      if (actionBtn) actionBtn.addEventListener('click', () => showWorktreeForm(widget, pane));
    }

    async function showWorktreeForm(widget, pane) {
      const wtPath    = getWorktreePath();
      const wtF1Path  = getWorktreeF1Path();
      const parts     = wtF1Path ? wtF1Path.split('/') : [];
      const curStatus = parts[0] || 'Active';
      const curFolder = parts.slice(1).join('/');

      let worktrees = [];
      try { worktrees = await fetch('/api/worktree-dirs').then(r => r.json()); } catch {}

      const body = widget.querySelector('#wt-widget-body');
      body.innerHTML =
        `<div class="readme-wt-form">` +
        `<select id="wt-form-worktree">` +
        `<option value="">— select worktree —</option>` +
        worktrees.map(w =>
          `<option value="${esc(w.path)}"${w.path === wtPath ? ' selected' : ''}>${esc(w.name)}</option>`
        ).join('') +
        `</select>` +
        `<select id="wt-form-status">` +
        `<option value="Active"${curStatus === 'Active' ? ' selected' : ''}>Active</option>` +
        `<option value="Backlog"${curStatus === 'Backlog' ? ' selected' : ''}>Backlog</option>` +
        `</select>` +
        `<select id="wt-form-folder"></select>` +
        `<div class="readme-wt-form-actions">` +
        `<button class="link-save-btn" id="wt-form-save">Save</button>` +
        `<button class="link-cancel-btn" id="wt-form-cancel">Cancel</button>` +
        `</div></div>`;

      const wtSel     = widget.querySelector('#wt-form-worktree');
      const statusSel = widget.querySelector('#wt-form-status');
      const folderSel = widget.querySelector('#wt-form-folder');

      // Repopulate whenever the worktree or status changes. `keep` is the folder the project
      // is currently pointed at: it stays selectable even when it isn't in the listing (a
      // renamed or deleted folder), so opening the form can never silently repoint a project.
      async function loadFolders(keep) {
        const wt = wtSel.value;
        if (!wt) {
          folderSel.innerHTML = `<option value="">— select a worktree first —</option>`;
          folderSel.disabled = true;
          return;
        }
        folderSel.disabled = true;
        folderSel.innerHTML = `<option value="">loading…</option>`;
        let folders = [];
        try {
          folders = await fetch(
            `/api/worktree-f1-folders?worktree=${encodeURIComponent(wt)}&status=${encodeURIComponent(statusSel.value)}`
          ).then(r => r.ok ? r.json() : []);
        } catch { folders = []; }

        // A stored path can differ in case from the folder on disk — macOS resolves it
        // either way, so the connection works and must not be shown as broken. Match
        // case-insensitively and select the canonical name, which also normalises the
        // stored value the next time the form is saved.
        const canonical = keep && folders.find(f => f.toLowerCase() === keep.toLowerCase());
        const selected  = canonical || keep;
        const opts = [...folders];
        if (selected && !canonical) opts.unshift(selected);   // genuinely absent
        folderSel.innerHTML =
          `<option value="">— select folder —</option>` +
          opts.map(f => {
            const missing = !folders.includes(f);
            return `<option value="${esc(f)}"${f === selected ? ' selected' : ''}>` +
              `${esc(f)}${missing ? ' (not found)' : ''}</option>`;
          }).join('');
        folderSel.disabled = false;
      }

      // Only preserve the current folder while the form still points at its own connection.
      wtSel.addEventListener('change', () => loadFolders(wtSel.value === wtPath ? curFolder : null));
      statusSel.addEventListener('change', () => loadFolders(statusSel.value === curStatus ? curFolder : null));
      loadFolders(curFolder);

      widget.querySelector('#wt-form-save').addEventListener('click', async () => {
        const wt  = wtSel.value;
        const st  = statusSel.value;
        const fol = folderSel.value;
        if (!wt || !fol) return;
        setWorktreeConnection(wt, `${st}/${fol}`);
        await saveReadme();
        renderReadme(pane);
      });
      widget.querySelector('#wt-form-cancel').addEventListener('click', () => renderWorktreeWidget(widget, pane));
      wtSel.focus();
    }

    // ── File sidebar tabs ────────────────────────────────────────────────────
    let activeFileTab = 'project';

    function refreshFilesTabs() {
      const wtPath = getWorktreePath();
      const tabBar = document.getElementById('files-tabs');
      if (!wtPath) { tabBar.hidden = true; return; }
      tabBar.hidden = false;
      tabBar.querySelectorAll('.files-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeFileTab);
      });
      applyFileTab();
    }

    function applyFileTab() {
      const fileNav = document.getElementById('file-nav');
      const wtNav   = document.getElementById('worktree-nav');
      if (activeFileTab === 'worktree') {
        fileNav.hidden = true;
        wtNav.hidden = false;
        loadWorktreeNav();
      } else {
        fileNav.hidden = false;
        wtNav.hidden = true;
      }
    }

    async function loadWorktreeNav() {
      const wtPath   = getWorktreePath();
      const wtF1Path = getWorktreeF1Path();
      const wtNav    = document.getElementById('worktree-nav');
      wtNav.innerHTML = '<p class="proj-empty">Loading…</p>';
      try {
        const files = await fetch(
          `/api/worktree-files?worktree=${encodeURIComponent(wtPath)}&f1path=${encodeURIComponent(wtF1Path)}`
        ).then(r => r.json());
        if (!files.length) { wtNav.innerHTML = '<p class="proj-empty">No files found</p>'; return; }
        wtNav.innerHTML = '';
        renderWorktreeTree(files, wtNav);
        // Not awaited — the tree shouldn't wait on a git subprocess to appear.
        decorateWorktreeGit(wtPath, wtF1Path, wtNav, ++worktreeNavToken);
      } catch {
        wtNav.innerHTML = '<p class="proj-empty">Error loading files</p>';
      }
    }

    // ── Worktree git state ──────────────────────────────────────────────────────

    let worktreeNavToken = 0;

    const GIT_STATE_LABELS = {
      modified: 'Modified', untracked: 'Untracked', staged: 'Staged', conflicted: 'Conflicted',
    };
    // A folder shows its most urgent child.
    const GIT_STATE_RANK = { conflicted: 3, modified: 2, untracked: 1, staged: 0 };

    async function decorateWorktreeGit(wtPath, wtF1Path, container, token) {
      let statuses;
      try {
        const data = await fetch(
          `/api/worktree-status?worktree=${encodeURIComponent(wtPath)}&f1path=${encodeURIComponent(wtF1Path)}`
        ).then(r => r.json());
        if (!data.ok) return;          // not a git repo, git missing, timeout — leave undecorated
        statuses = data.statuses;
      } catch {
        return;
      }
      // loadWorktreeNav runs on every tab activation, so a slow response can arrive after
      // the tree it was requested for has been replaced.
      if (token !== worktreeNavToken) return;

      const folders = {};
      for (const [p, state] of Object.entries(statuses)) {
        const parts = p.split('/');
        for (let i = 0; i < parts.length - 1; i++) {
          const key = parts.slice(0, i + 1).join('/');
          if (!(key in folders) || GIT_STATE_RANK[state] > GIT_STATE_RANK[folders[key]]) {
            folders[key] = state;
          }
        }
      }

      for (const el of container.querySelectorAll('[data-git-path]')) {
        const dot = el.querySelector(':scope > .git-dot');
        if (!dot) continue;
        dot.className = 'git-dot';     // reset, so re-decoration after a save clears stale dots
        dot.hidden = true;
        dot.removeAttribute('title');
        const isFolder = el.classList.contains('folder-header');
        const state = (isFolder ? folders : statuses)[el.dataset.gitPath];
        if (!state) continue;
        dot.className = `git-dot git-dot--${state}`;
        dot.title = GIT_STATE_LABELS[state];
        dot.hidden = false;
      }
    }

    // Re-run only the decoration pass — a save can't change the file list.
    function refreshWorktreeGitDots() {
      const wtNav = document.getElementById('worktree-nav');
      if (!wtNav || wtNav.hidden) return;
      const wtPath = getWorktreePath();
      const wtF1Path = getWorktreeF1Path();
      if (!wtPath || !wtF1Path) return;
      decorateWorktreeGit(wtPath, wtF1Path, wtNav, worktreeNavToken);
    }

    function renderWorktreeTree(files, container) {
      const tree = { dirs: {}, files: [] };
      for (const f of files) {
        if (f.endsWith('/')) continue;
        const parts = f.split('/');
        let node = tree;
        for (let i = 0; i < parts.length - 1; i++) {
          if (!node.dirs[parts[i]]) {
            node.dirs[parts[i]] = { dirs: {}, files: [], path: parts.slice(0, i + 1).join('/') };
          }
          node = node.dirs[parts[i]];
        }
        node.files.push({ name: parts[parts.length - 1], path: f });
      }
      renderWorktreeNode(tree, container);
    }

    function renderWorktreeNode(node, container) {
      for (const dir of Object.keys(node.dirs).sort()) {
        const item = document.createElement('div');
        item.className = 'folder-item';
        const header = document.createElement('div');
        header.className = 'folder-header';
        header.innerHTML =
          `<span class="folder-chevron"></span>` +
          `<span class="folder-name">${esc(dir)}</span>` +
          `<span class="git-dot" hidden></span>`;
        header.dataset.gitPath = node.dirs[dir].path;
        const children = document.createElement('div');
        children.className = 'folder-children';
        header.addEventListener('click', () => {
          const c = children.classList.toggle('collapsed');
          header.querySelector('.folder-chevron').classList.toggle('collapsed', c);
        });
        item.appendChild(header);
        item.appendChild(children);
        container.appendChild(item);
        renderWorktreeNode(node.dirs[dir], children);
      }
      for (const f of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
        const row = document.createElement('div');
        row.className = 'file-row';
        const btn = document.createElement('button');
        btn.className = 'checklist-nav-btn';
        btn.innerHTML =
          `<svg class="nav-tree-icon nav-tree-icon--file" width="12" height="12" viewBox="0 0 12 12" fill="none">` +
          `<rect x="1.5" y="0.5" width="9" height="11" rx="1" stroke="currentColor"/>` +
          `<line x1="3.5" y1="3.5" x2="8.5" y2="3.5" stroke="currentColor"/>` +
          `<line x1="3.5" y1="5.5" x2="8.5" y2="5.5" stroke="currentColor"/>` +
          `<line x1="3.5" y1="7.5" x2="6.5" y2="7.5" stroke="currentColor"/>` +
          `</svg>` +
          `<span class="file-label">${esc(f.name.replace(/\.md$/, ''))}</span>`;
        btn.addEventListener('click', () => openWorktreeFile(f.path));
        row.appendChild(btn);
        // Sibling of the button, not inside it: keeps the dot out of the click target and
        // puts it in the same trailing slot .file-row-delete uses on the project tree.
        const dot = document.createElement('span');
        dot.className = 'git-dot';
        dot.hidden = true;
        row.appendChild(dot);
        row.dataset.gitPath = f.path;
        container.appendChild(row);
      }
    }

    async function openWorktreeFile(relPath) {
      const wtPath   = getWorktreePath();
      const wtF1Path = getWorktreeF1Path();
      const label    = relPath.split('/').pop().replace(/\.md$/, '');
      const key      = `wt:${relPath}`;
      try {
        const data = await fetch(
          `/api/worktree-md?worktree=${encodeURIComponent(wtPath)}&f1path=${encodeURIComponent(wtF1Path)}&file=${encodeURIComponent(relPath)}`
        ).then(r => r.json());
        editorApi.openContent(key, label, data.markdown, async (md) => {
          const r = await fetch('/api/worktree-md', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ worktree: wtPath, f1path: wtF1Path, file: relPath, content: md }),
          });
          const d = await r.json();
          if (d.error) throw new Error(d.error);
          refreshWorktreeGitDots();
        });
      } catch (err) {
        alert(`Error opening file: ${err.message}`);
      }
    }

    function parseLinkSection(lines) {
      const groups = [];
      let cur = { heading: null, links: [] };
      for (const raw of lines) {
        const line = raw.trim();
        const h3 = line.match(/^### (.+)/);
        if (h3) {
          if (cur.heading !== null || cur.links.length > 0) groups.push(cur);
          cur = { heading: h3[1].trim(), links: [] };
          continue;
        }
        const m = line.match(/^- \[([^\]]*)\]\(([^)]*)\)/);
        if (m) cur.links.push({ label: m[1], url: m[2] });
      }
      groups.push(cur);
      return groups;
    }

    // Flat checkbox list. Non-checkbox lines are preserved in place — `preamble` holds
    // those before the first item, `item.after` those following a given item — so hand-written
    // prose inside the section survives a toggle. `indent` is captured verbatim (the widget is
    // flat, but a pre-existing nested list must not be silently flattened).
    function parseChecklistSection(lines) {
      const items = [];
      const preamble = [];
      for (const raw of lines) {
        // `(.*)` not `(.+)`: a bare `- [ ]` must parse as an empty item, not fall through to prose.
        const m = raw.match(/^(\s*)- \[([ xX])\]\s?(.*)$/);
        if (m) {
          items.push({ indent: m[1], checked: m[2].toLowerCase() === 'x', text: m[3].trim(), after: [] });
        } else if (raw.trim()) {
          (items.length ? items[items.length - 1].after : preamble).push(raw);
        }
      }
      return { type: 'checklist', name: CHECKLIST_SECTION, preamble, items };
    }

    // Existing project READMEs predate this section. Splice in a virtual one so the widget is
    // always available; `ephemeral` keeps serializeReadme from writing it until it's actually used.
    function ensureChecklistSection(doc) {
      if (doc.sections.some(s => s.name === CHECKLIST_SECTION)) return;
      const i = doc.sections.findIndex(s => s.type === 'links');
      doc.sections.splice(i === -1 ? doc.sections.length : i, 0, {
        type: 'checklist', name: CHECKLIST_SECTION, preamble: [], items: [], ephemeral: true,
      });
    }

    function parseReadme(markdown) {
      const allLines = markdown.split('\n');
      const headerLines = [];
      let firstH2 = -1;
      for (let i = 0; i < allLines.length; i++) {
        if (allLines[i].match(/^## /)) { firstH2 = i; break; }
        headerLines.push(allLines[i]);
      }
      if (firstH2 === -1) return { headerLines: allLines, sections: [] };

      const sections = [];
      let cur = null;
      for (const line of allLines.slice(firstH2)) {
        const h2 = line.match(/^## (.+)/);
        if (h2) {
          if (cur) sections.push(cur);
          cur = { name: h2[1].trim(), lines: [] };
        } else if (cur) {
          cur.lines.push(line);
        }
      }
      if (cur) sections.push(cur);

      return {
        headerLines,
        sections: sections.map(s => {
          if (s.name === CHECKLIST_SECTION) return parseChecklistSection(s.lines);
          if (LINK_SECTIONS.has(s.name)) return { type: 'links', name: s.name, groups: parseLinkSection(s.lines) };
          return { type: 'prose', name: s.name, lines: s.lines };
        }),
      };
    }

    function extractSectionHtml(fullHtml) {
      const doc = new DOMParser().parseFromString(fullHtml, 'text/html');
      const map = {};
      let cur = null;
      let buf = [];
      const flush = () => { if (cur) map[cur] = buf.map(n => n.outerHTML).join(''); };
      for (const node of doc.body.children) {
        if (node.tagName === 'H2') { flush(); cur = node.textContent.trim(); buf = []; }
        else if (cur) buf.push(node);
      }
      flush();
      return map;
    }

    function serializeReadme(doc) {
      const parts = [doc.headerLines.join('\n')];
      for (const s of doc.sections) {
        parts.push(`\n## ${s.name}\n`);
        if (s.type === 'prose') {
          parts.push(s.lines.join('\n'));
        } else if (s.type === 'checklist') {
          // Never materialise an unused virtual section — drop the heading we just pushed.
          if (s.ephemeral && !s.items.length && !s.preamble.length) { parts.pop(); continue; }
          const out = [...s.preamble];
          if (s.preamble.length) out.push('');
          for (const it of s.items) {
            out.push(`${it.indent}- [${it.checked ? 'x' : ' '}] ${it.text}`.trimEnd());
            out.push(...it.after);
          }
          parts.push(out.join('\n'));
        } else {
          for (const g of s.groups) {
            if (g.heading !== null) parts.push(`\n### ${g.heading}\n`);
            if (g.links.length) parts.push('\n' + g.links.map(l => `- [${l.label}](${l.url})`).join('\n'));
          }
          parts.push('');
        }
      }
      return parts.join('\n');
    }

    async function saveReadme() {
      const fullPath = projectPath ? `${projectPath}/README.md` : 'README.md';
      const r = await fetch('/api/project-file', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ root, path: fullPath, content: serializeReadme(readmeDoc) }),
      });
      return r.json();
    }

    function readmeLinkItemHTML(secName, gi, li, link) {
      const s = esc(secName), g = gi, l = li;
      return `<li class="links-item" data-sec="${s}" data-gi="${g}" data-li="${l}">` +
        `<div class="links-item-main">` +
        `<a class="links-link" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.label)}</a>` +
        `<span class="links-url-hint">${esc(domain(link.url))}</span>` +
        `</div>` +
        `<div class="links-item-actions">` +
        `<button class="links-action-btn" data-action="edit"   data-sec="${s}" data-gi="${g}" data-li="${l}">Edit</button>` +
        `<button class="links-action-btn links-action-delete"  data-action="delete" data-sec="${s}" data-gi="${g}" data-li="${l}">×</button>` +
        `</div></li>`;
    }

    // ── Project Checklist widget ────────────────────────────────────────────────
    // Flat variant of the meeting checklist (see meeting.html buildListHTML/wireListHandlers):
    // no ### groups, no indent controls, no drag-reorder.

    function buildChecklistWidget(sec) {
      const widget = document.createElement('div');
      widget.className = 'readme-widget';
      widget.innerHTML =
        `<div class="readme-widget-header">` +
        `<span>${esc(sec.name)} <span class="checklist-progress"></span></span></div>`;
      const body = document.createElement('div');
      body.className = 'readme-widget-body checklist-widget-body';
      widget.appendChild(body);
      renderChecklistBody(body, sec);
      return widget;
    }

    function renderChecklistBody(bodyEl, sec) {
      const note = line => `<div class="checklist-note">${esc(line)}</div>`;
      let html = sec.preamble.map(note).join('');

      if (!sec.items.length && !sec.preamble.length) {
        html += `<p class="proj-empty">—</p>`;
      }
      sec.items.forEach((it, i) => {
        html += `<div class="meeting-task" data-idx="${i}">
          <input type="checkbox" ${it.checked ? 'checked' : ''}>
          <span class="task-text">${esc(it.text)}</span>
          <div class="task-controls"><button class="item-delete-btn" title="Delete">×</button></div>
        </div>`;
        html += it.after.map(note).join('');
      });

      html += `<div class="add-item-row">
        <button class="add-item-btn">+ Add item</button>
        <input type="text" class="add-item-input" placeholder="New deliverable…">
      </div>`;

      bodyEl.innerHTML = html;

      const progress = bodyEl.closest('.readme-widget').querySelector('.checklist-progress');
      progress.textContent = sec.items.length
        ? `${sec.items.filter(it => it.checked).length}/${sec.items.length}`
        : '';

      wireChecklistHandlers(bodyEl, sec);
    }

    async function saveChecklist(sec, bodyEl) {
      sec.ephemeral = false;
      await saveReadme();
      renderChecklistBody(bodyEl, sec);
    }

    function wireChecklistHandlers(bodyEl, sec) {
      bodyEl.querySelectorAll('.meeting-task input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          sec.items[parseInt(cb.closest('.meeting-task').dataset.idx)].checked = cb.checked;
          saveChecklist(sec, bodyEl);
        });
      });

      bodyEl.querySelectorAll('.meeting-task .item-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.closest('.meeting-task').dataset.idx);
          // Re-home the deleted item's trailing prose so it isn't silently eaten.
          const orphaned = sec.items[idx].after;
          (idx > 0 ? sec.items[idx - 1].after : sec.preamble).push(...orphaned);
          sec.items.splice(idx, 1);
          saveChecklist(sec, bodyEl);
        });
      });

      bodyEl.querySelectorAll('.task-text').forEach(span => {
        span.addEventListener('dblclick', () => startChecklistEdit(span, sec, bodyEl));
      });

      const row   = bodyEl.querySelector('.add-item-row');
      const btn   = row.querySelector('.add-item-btn');
      const input = row.querySelector('.add-item-input');
      btn.addEventListener('click', () => {
        btn.style.display = 'none'; input.style.display = 'block'; input.focus();
      });
      const dismiss = () => { input.value = ''; input.style.display = 'none'; btn.style.display = ''; };
      input.addEventListener('keydown', async e => {
        if (e.key === 'Enter') {
          const text = input.value.trim();
          if (!text) { dismiss(); return; }
          sec.items.push({ indent: '', checked: false, text, after: [] });
          dismiss();
          await saveChecklist(sec, bodyEl);
        }
        if (e.key === 'Escape') dismiss();
      });
      input.addEventListener('blur', dismiss);
    }

    function startChecklistEdit(span, sec, bodyEl) {
      const idx = parseInt(span.closest('.meeting-task').dataset.idx);
      const current = span.textContent;
      const input = document.createElement('input');
      input.type = 'text'; input.value = current; input.className = 'inline-edit-input';
      span.replaceWith(input); input.focus(); input.select();
      let saved = false;
      const save = async () => {
        if (saved) return; saved = true;
        const newText = input.value.trim();
        if (newText && newText !== current) {
          sec.items[idx].text = newText;
          await saveChecklist(sec, bodyEl);
        } else {
          renderChecklistBody(bodyEl, sec);
        }
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') save();
        if (e.key === 'Escape') { saved = true; renderChecklistBody(bodyEl, sec); }
      });
      input.addEventListener('blur', save);
    }

    function renderReadme(pane) {
      pane.innerHTML = '';

      const layout  = document.createElement('div');
      layout.className = 'readme-layout';
      const leftCol  = document.createElement('div');
      leftCol.className = 'readme-col';
      const rightCol = document.createElement('div');
      rightCol.className = 'readme-col';

      // Left: all non-link sections in document order
      for (const sec of readmeDoc.sections) {
        if (sec.type === 'links') continue;
        if (sec.type === 'checklist') { leftCol.appendChild(buildChecklistWidget(sec)); continue; }
        const widget = document.createElement('div');
        widget.className = 'readme-widget';
        widget.innerHTML =
          `<div class="readme-widget-header">${esc(sec.name)}` +
          `<button class="readme-edit-btn">Edit</button></div>`;

        const proseBody = document.createElement('div');
        proseBody.className = 'readme-widget-body prose';
        proseBody.innerHTML = sectionHtmlMap[sec.name] || `<p class="proj-empty">—</p>`;
        widget.appendChild(proseBody);

        const editArea = document.createElement('div');
        editArea.className = 'readme-prose-edit';
        editArea.hidden = true;
        editArea.innerHTML =
          `<textarea class="readme-prose-textarea"></textarea>` +
          `<div class="readme-prose-actions">` +
          `<button class="link-save-btn">Save</button>` +
          `<button class="link-cancel-btn">Cancel</button>` +
          `</div>`;
        widget.appendChild(editArea);

        widget.querySelector('.readme-edit-btn').addEventListener('click', () => {
          proseBody.hidden = true;
          editArea.hidden = false;
          editArea.querySelector('textarea').value = sec.lines.join('\n').trim();
          editArea.querySelector('textarea').focus();
        });

        editArea.querySelector('.link-save-btn').addEventListener('click', async () => {
          const newText = editArea.querySelector('textarea').value;
          sec.lines = newText ? newText.split('\n') : [''];
          await saveReadme();
          const mdPath = projectPath ? `${projectPath}/README.md` : 'README.md';
          const refreshed = await fetch(`/api/md?root=${encodeURIComponent(root)}&path=${encodeURIComponent(mdPath)}`).then(r => r.json());
          sectionHtmlMap = extractSectionHtml(refreshed.html);
          renderReadme(pane);
        });

        editArea.querySelector('.link-cancel-btn').addEventListener('click', () => {
          proseBody.hidden = false;
          editArea.hidden = true;
        });
        leftCol.appendChild(widget);
      }

      // Left: Conversations widget (Slack tracker) — work-mode feature, projects only
      if (root === 'projects' && projectPath && wsFeatures.has('conversations')) {
        const convWidget = document.createElement('div');
        convWidget.className = 'readme-widget';
        leftCol.appendChild(convWidget);
        renderConversationsWidget(convWidget, projectPath);
      }

      // Left: Tasks widget
      if (root === 'projects') {
        const tasksWidget = document.createElement('div');
        tasksWidget.className = 'readme-widget';
        tasksWidget.innerHTML =
          `<div class="readme-widget-header"><span>Tasks</span>` +
          `<button class="icon-btn" id="proj-task-new-btn" title="New task">+</button></div>` +
          `<div class="readme-widget-body tasks-widget-body"></div>`;
        tasksWidget.querySelector('#proj-task-new-btn').addEventListener('click', () => openTaskModal());
        leftCol.appendChild(tasksWidget);
        currentProjectFilter = projectPath;
        tasksBoardEl = tasksWidget.querySelector('.tasks-widget-body');
        fetchTasks();
      }

      // Right: Status widget
      const currentStatus = getReadmeStatus();
      const statusWidget  = document.createElement('div');
      statusWidget.className = 'readme-widget';
      statusWidget.innerHTML =
        `<div class="readme-widget-header">Status</div>` +
        `<div class="readme-widget-body readme-status-body">` +
        `<div class="readme-status-display">` +
        `<span class="status-dot status-${currentStatus.replace(/\s+/g, '-')}"></span>` +
        `<span class="readme-status-label">${esc(currentStatus) || '—'}</span>` +
        `<span class="readme-status-hint">click to change</span>` +
        `</div></div>`;

      statusWidget.querySelector('.readme-status-display').addEventListener('click', () => {
        const body = statusWidget.querySelector('.readme-status-body');
        body.innerHTML =
          `<select class="readme-status-select">` +
          STATUS_VALUES.map(s =>
            `<option value="${s}"${s === currentStatus ? ' selected' : ''}>${s}</option>`
          ).join('') +
          `</select>`;
        const sel = body.querySelector('select');
        sel.focus();
        sel.addEventListener('change', async () => {
          const newStatus = sel.value;
          setReadmeStatus(newStatus);
          await saveReadme();
          if (root === 'projects' && projectPath) {
            await fetch('/api/project-status', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ path: `${projectPath}/README.md`, status: newStatus }),
            });
          }
          renderReadme(pane);
        });
        sel.addEventListener('blur', () => renderReadme(pane));
      });

      rightCol.appendChild(statusWidget);

      // Right: Worktree connection widget
      const wtWidget = document.createElement('div');
      wtWidget.className = 'readme-widget';
      renderWorktreeWidget(wtWidget, pane);
      rightCol.appendChild(wtWidget);

      // Right: Documentation and Links & Resources
      for (const sec of readmeDoc.sections) {
        if (sec.type !== 'links') continue;
        const widget = document.createElement('div');
        widget.className = 'readme-widget';
        widget.innerHTML = `<div class="readme-widget-header">${esc(sec.name)}</div>`;

        sec.groups.forEach((group, gi) => {
          const groupEl = document.createElement('div');
          groupEl.className = 'readme-link-group';
          groupEl.innerHTML =
            (group.heading ? `<div class="readme-link-group-title">${esc(group.heading)}</div>` : '') +
            `<ul class="links-list">` +
            group.links.map((link, li) => readmeLinkItemHTML(sec.name, gi, li, link)).join('') +
            `</ul>` +
            `<div class="links-add-area">` +
            `<button class="add-link-trigger" data-sec="${esc(sec.name)}" data-gi="${gi}">+ Add link</button>` +
            `<form class="add-link-form" data-sec="${esc(sec.name)}" data-gi="${gi}">` +
            `<input class="link-input" name="label" placeholder="Label" autocomplete="off" />` +
            `<input class="link-input link-input-url" name="url" placeholder="https://…" autocomplete="off" />` +
            `<div class="link-form-actions">` +
            `<button type="submit" class="link-save-btn">Save</button>` +
            `<button type="button" class="link-cancel-btn">Cancel</button>` +
            `</div></form></div>`;
          widget.appendChild(groupEl);
        });

        const addFolderEl = document.createElement('div');
        addFolderEl.className = 'links-add-folder-area';
        addFolderEl.innerHTML =
          `<button class="add-folder-trigger" data-sec="${esc(sec.name)}">+ Add folder</button>` +
          `<form class="add-folder-form" data-sec="${esc(sec.name)}">` +
          `<input class="link-input" name="folder-name" placeholder="Folder name…" autocomplete="off" />` +
          `<div class="link-form-actions">` +
          `<button type="submit" class="link-save-btn">Add</button>` +
          `<button type="button" class="link-cancel-btn">Cancel</button>` +
          `</div></form>`;
        widget.appendChild(addFolderEl);
        rightCol.appendChild(widget);
      }

      layout.appendChild(leftCol);
      layout.appendChild(rightCol);
      pane.appendChild(layout);
      bindReadmeEvents(pane);
      refreshFilesTabs();
    }

    function bindReadmeEvents(pane) {
      function getGroup(el) {
        const sec = readmeDoc.sections.find(s => s.name === el.dataset.sec);
        return sec ? sec.groups[parseInt(el.dataset.gi)] : null;
      }

      pane.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const group = getGroup(btn);
          if (!group) return;
          group.links.splice(parseInt(btn.dataset.li), 1);
          saveReadme().then(() => renderReadme(pane));
        });
      });

      pane.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => startEditReadmeLink(pane, btn));
      });

      pane.querySelectorAll('.add-link-trigger').forEach(trigger => {
        trigger.addEventListener('click', () => {
          trigger.style.display = 'none';
          const form = trigger.nextElementSibling;
          form.classList.add('open');
          form.querySelector('[name="label"]').focus();
        });
      });

      pane.querySelectorAll('.add-link-form').forEach(form => {
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const label = form.querySelector('[name="label"]').value.trim();
          const url   = form.querySelector('[name="url"]').value.trim();
          if (!label || !url) return;
          const group = getGroup(form);
          if (!group) return;
          group.links.push({ label, url });
          await saveReadme();
          renderReadme(pane);
        });
        form.querySelector('.link-cancel-btn').addEventListener('click', () => renderReadme(pane));
      });

      pane.querySelectorAll('.add-folder-trigger').forEach(trigger => {
        trigger.addEventListener('click', () => {
          trigger.style.display = 'none';
          const form = trigger.nextElementSibling;
          form.classList.add('open');
          form.querySelector('[name="folder-name"]').focus();
        });
      });

      pane.querySelectorAll('.add-folder-form').forEach(form => {
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const name = form.querySelector('[name="folder-name"]').value.trim();
          if (!name) return;
          const sec = readmeDoc.sections.find(s => s.name === form.dataset.sec);
          if (!sec) return;
          sec.groups.push({ heading: name, links: [] });
          await saveReadme();
          renderReadme(pane);
        });
        form.querySelector('.link-cancel-btn').addEventListener('click', () => renderReadme(pane));
      });
    }

    function startEditReadmeLink(pane, btn) {
      const sec   = readmeDoc.sections.find(s => s.name === btn.dataset.sec);
      const group = sec?.groups[parseInt(btn.dataset.gi)];
      if (!group) return;
      const link = group.links[parseInt(btn.dataset.li)];
      const item = btn.closest('.links-item');
      item.innerHTML =
        `<form class="link-edit-form">` +
        `<input class="link-input" name="label" value="${esc(link.label)}" autocomplete="off" />` +
        `<input class="link-input link-input-url" name="url" value="${esc(link.url)}" autocomplete="off" />` +
        `<div class="link-form-actions">` +
        `<button type="submit" class="link-save-btn">Save</button>` +
        `<button type="button" class="link-cancel-btn">Cancel</button>` +
        `</div></form>`;
      const form = item.querySelector('form');
      form.querySelector('[name="label"]').focus();
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const newLabel = form.querySelector('[name="label"]').value.trim();
        const newUrl   = form.querySelector('[name="url"]').value.trim();
        if (!newLabel || !newUrl) return;
        group.links[parseInt(btn.dataset.li)] = { label: newLabel, url: newUrl };
        await saveReadme();
        renderReadme(pane);
      });
      form.querySelector('.link-cancel-btn').addEventListener('click', () => renderReadme(pane));
    }

    const editorApi = initEditor({
      root, projectPath, initialFile,
      sidebarEl:      document.getElementById('project-sidebar'),
      navEl:          document.getElementById('file-nav'),
      tabsEl:         document.getElementById('editor-tabs'),
      contentEl:      document.getElementById('editor-content'),
      emptyEl:        document.getElementById('editor-empty'),
      tabsEmptyEl:    document.getElementById('editor-tabs-empty'),
      fileAddBtn:     document.getElementById('file-add-btn'),
      newFileRow:     document.getElementById('new-file-row'),
      newFileInput:   document.getElementById('new-file-input'),
      folderAddBtn:   document.getElementById('folder-add-btn'),
      newFolderRow:   document.getElementById('new-folder-row'),
      newFolderInput: document.getElementById('new-folder-input'),
      vResizeHandle:  document.getElementById('col-resize'),
      onOpenPane(relPath, data, tab, pane, isPermanent) {
        if (isPermanent) {
          pane.classList.add('readme-view');
          readmeDoc      = parseReadme(data.markdown);
          sectionHtmlMap = extractSectionHtml(data.html);
          if (root === 'projects') ensureChecklistSection(readmeDoc);
          renderReadme(pane);
          if (root !== 'projects') {
            editorApi.openCustomPane('__tasks__', 'Tasks', tasksPane => renderTasksPane(tasksPane, projectPath), { permanent: true });
          }
        } else {
          setupTuiPane(pane, tab, {
            markdown: data.markdown,
            root,
            savePath: projectPath ? `${projectPath}/${relPath}` : relPath,
            openFileFn: path => editorApi.openFile(path),
            filesUrl: projectPath
              ? `/api/project-files?root=${encodeURIComponent(root)}&path=${encodeURIComponent(projectPath)}`
              : `/api/project-files?root=${encodeURIComponent(root)}`,
          });
        }
      },
      autoOpenReadme: root !== 'f1',
    });

    if (root === 'f1') editorApi.openCustomPane('__tasks__', 'Tasks', tasksPane => renderTasksPane(tasksPane, null), { permanent: true });

    document.querySelectorAll('.files-tab').forEach(btn => {
      btn.addEventListener('click', () => { activeFileTab = btn.dataset.tab; refreshFilesTabs(); });
    });

    // ── Tasks tab ─────────────────────────────────────────────────────────────
    let taskById = {};
    let tasksData = null;
    let currentProjectFilter = null;
    let tasksBoardEl = null;

    function renderTasksPane(pane, projectFilter) {
      currentProjectFilter = projectFilter;
      pane.classList.add('editor-pane-tasks');
      pane.innerHTML = `
        <div class="proj-tasks-header">
          <span>Tasks</span>
          <button class="icon-btn" id="proj-task-new-btn" title="New task">+</button>
        </div>
        <div class="proj-tasks-board"></div>
      `;
      tasksBoardEl = pane.querySelector('.proj-tasks-board');
      pane.querySelector('#proj-task-new-btn').addEventListener('click', () => openTaskModal());
      fetchTasks();
    }

    function fetchTasks() {
      const url = currentProjectFilter
        ? `/api/tasks?project=${encodeURIComponent(currentProjectFilter)}`
        : '/api/tasks';
      return fetch(url)
        .then(r => r.json())
        .then(data => {
          if (!data.connected || !tasksBoardEl) return;
          tasksData = data;
          const allTasks = [...(data.today ?? []), ...(data.backlog ?? [])];
          taskById = Object.fromEntries(allTasks.map(t => [t.id, t]));
          renderKanbanBoard({
            containerEl: tasksBoardEl,
            tasks: allTasks,
            projectNameFor: () => '',
            onDrop: changeTaskStatus,
            onEdit: openTaskModal,
          });
        });
    }

    function changeTaskStatus(taskId, status) {
      fetch(`/api/tasks/${encodeURIComponent(taskId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      }).then(() => fetchTasks());
    }

    // ── Task modal ──────────────────────────────────────────────────────────────
    let editingTaskId = null;

    function buildActivityPills(selected = []) {
      const container = document.getElementById('task-modal-activity');
      container.innerHTML = wsActivityTypes.map(a =>
        `<label class="pill-toggle">` +
        `<input type="checkbox" value="${esc(a)}"${selected.includes(a) ? ' checked' : ''} />` +
        `<span>${esc(a)}</span>` +
        `</label>`
      ).join('');
    }

    function populateTaskModalProjects(selected) {
      const sel = document.getElementById('task-modal-project');
      fetch('/api/projects').then(r => r.json()).then(projects => {
        const folder = p => p.path.replace(/\/[^/]+\.md$/, '');
        sel.innerHTML = '<option value="">&mdash; none &mdash;</option>' +
          projects.map(p => `<option value="${esc(folder(p))}">${esc(p.name)}</option>`).join('');
        sel.value = selected ?? '';
      });
    }

    function openTaskModal(taskId = null) {
      editingTaskId = taskId;
      const t = taskId ? taskById[taskId] : null;
      document.getElementById('task-modal-title').textContent = t ? 'Edit Task' : 'New Task';
      document.getElementById('task-modal-name').value    = t ? t.title   : '';
      document.getElementById('task-modal-status').value  = t ? (t.status ?? 'Backlog') : 'Backlog';
      populateTaskModalProjects(t ? (t.project ?? currentProjectFilter) : currentProjectFilter);
      buildActivityPills(t ? (t.activity ?? []) : []);
      document.getElementById('task-modal-delete').hidden = !taskId;
      document.getElementById('task-modal-overlay').classList.add('open');
      document.getElementById('task-modal-name').focus();
    }

    function closeTaskModal() {
      document.getElementById('task-modal-overlay').classList.remove('open');
      editingTaskId = null;
    }

    document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
    document.getElementById('task-modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('task-modal-overlay')) closeTaskModal();
    });

    document.getElementById('task-modal-delete').addEventListener('click', async () => {
      if (!editingTaskId) return;
      if (!confirm('Delete this task?')) return;
      const btn = document.getElementById('task-modal-delete');
      btn.disabled = true;
      try {
        await fetch(`/api/tasks/${encodeURIComponent(editingTaskId)}`, { method: 'DELETE' });
        closeTaskModal();
        await fetchTasks();
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('task-modal-submit').addEventListener('click', async () => {
      const name    = document.getElementById('task-modal-name').value.trim();
      if (!name) { document.getElementById('task-modal-name').focus(); return; }
      const status  = document.getElementById('task-modal-status').value;
      const project = document.getElementById('task-modal-project').value || null;
      const activity = [...document.querySelectorAll('#task-modal-activity input:checked')].map(el => el.value);

      const btn = document.getElementById('task-modal-submit');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        if (editingTaskId) {
          await fetch(`/api/tasks/${encodeURIComponent(editingTaskId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: name, status, project, activity }),
          });
        } else {
          await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: name, status, project, activity }),
          });
        }
        closeTaskModal();
        await fetchTasks();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save';
      }
    });
  </script>
</body>
</html>
