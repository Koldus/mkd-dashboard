<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspace</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="quotes.js"></script>
  <script src="resize.js" defer></script>
</head>
<body>

  <header>
    <span class="header-title">Workspace</span>
    <div class="header-right">
      <span class="header-date" id="header-date"></span>
      <a href="/editor.html?root=notebook" class="header-link" data-feature="notebook">Notebook</a>
      <a href="/links.html" class="header-link">Links</a>
    </div>
  </header>

  <main class="split-layout has-footer">

    <div class="col-left">
      <section class="panel" id="panel-tasks">
        <h2 class="panel-title">
          <span>Tasks</span>
          <div class="task-filters">
            <button class="icon-btn" id="task-new-btn" title="New task">+</button>
            <select id="activity-filter" class="task-filter-select">
              <option value="">all tasks</option>
            </select>
            <select id="project-filter" class="task-filter-select">
              <option value="">all projects</option>
            </select>
          </div>
        </h2>
        <div class="panel-content" id="tasks-content">
          <div class="tasks-placeholder">
            <p class="placeholder-msg">No tasks yet</p>
            <p class="placeholder-hint">Click + to add one.</p>
          </div>
        </div>
      </section>
    </div>

    <div class="resize-handle"></div>

    <div class="col-right">
      <!-- RIGHT: Tabbed panel (full height) -->
      <section class="panel" id="panel-right">
        <div class="panel-title">
          <nav class="tab-nav">
            <button class="tab-btn active" data-tab="projects">Projects</button>
            <button class="tab-btn" data-tab="meetings" data-feature="meetings">Meetings</button>
            <button class="tab-btn" data-tab="conversations" data-feature="conversations">Conversations</button>
          </nav>
          <div style="display:flex;align-items:center;gap:8px;">
            <label class="toggle-label" id="show-active-only-label">
              <input type="checkbox" id="show-active-only-toggle" />
              <span>show only active</span>
            </label>
            <label class="toggle-label" id="show-done-label">
              <input type="checkbox" id="show-done-toggle" />
              <span>show done</span>
            </label>
            <button class="icon-btn" id="new-project-btn" title="New project">+</button>
          </div>
        </div>
        <div class="panel-content" id="section-content"></div>
      </section>
    </div>

  </main>

  <footer id="quote-footer">
    <span id="quote-text"></span>
    <span id="quote-attr"></span>
  </footer>

  <!-- New project modal -->
  <div class="modal-overlay" id="new-project-overlay">
    <div class="modal">
      <div class="modal-title">New Project</div>
      <div class="modal-body">
        <label class="modal-field">
          <span class="modal-label">Name</span>
          <input type="text" id="new-project-name" class="modal-input" placeholder="My Project" />
        </label>
        <label class="modal-field">
          <span class="modal-label">Group</span>
          <select id="new-project-group" class="modal-input">
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button class="modal-btn" id="new-project-cancel">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="new-project-submit">Create</button>
      </div>
    </div>
  </div>

  <!-- Task modal -->
  <div class="modal-overlay" id="task-modal-overlay">
    <div class="modal">
      <div class="modal-title" id="task-modal-title">New Task</div>
      <div class="modal-body">
        <label class="modal-field">
          <span class="modal-label">Task</span>
          <input type="text" id="task-modal-name" class="modal-input" placeholder="Task name" autocomplete="off" />
        </label>
        <label class="modal-field">
          <span class="modal-label">Status</span>
          <select id="task-modal-status" class="modal-input">
            <option>Backlog</option>
            <option>Plan soon</option>
            <option>This Week</option>
            <option>Today</option>
            <option>In progress</option>
            <option>Done</option>
          </select>
        </label>
        <label class="modal-field">
          <span class="modal-label">Project</span>
          <select id="task-modal-project" class="modal-input">
            <option value="">&mdash; none &mdash;</option>
          </select>
        </label>
        <div class="modal-field">
          <span class="modal-label">Activity</span>
          <div class="modal-pills" id="task-modal-activity"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-danger" id="task-modal-delete" hidden>Delete</button>
        <button class="modal-btn" id="task-modal-cancel">Cancel</button>
        <button class="modal-btn modal-btn-primary" id="task-modal-submit">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { renderKanbanBoard } from './kanban.js';

    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // ── Workspace config ──────────────────────────────────────────────────────
    let workspaceFeatures = new Set();
    let wsActivityTypes = [];

    function applyWorkspaceConfig(ws) {
      workspaceFeatures = new Set(ws.features);

      document.title = ws.name;

      // Hide nav links and tabs for inactive features
      document.querySelectorAll('[data-feature]').forEach(el => {
        if (!workspaceFeatures.has(el.dataset.feature)) {
          el.style.display = 'none';
        }
      });

    }

    fetch('/api/workspace').then(r => r.json()).then(ws => {
      applyWorkspaceConfig(ws);
      wsActivityTypes = ws.activityTypes || [];
      const actSel = document.getElementById('activity-filter');
      actSel.innerHTML = '<option value="">all tasks</option>' +
        wsActivityTypes.map(a => `<option value="${a}">${a}</option>`).join('');
    });

    fetch('/api/project-groups').then(r => r.json()).then(groups => {
      const sel = document.getElementById('new-project-group');
      sel.innerHTML = groups.map((g, i) =>
        `<option value="${g.prefix}"${i === 0 ? ' selected' : ''}>${g.label}</option>`
      ).join('');
    });

    // ── Projects tab ──────────────────────────────────────────────────────────
    let allProjects = [];
    const ACTIVE_STATUSES = new Set(['active']);

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str ?? '';
      return d.innerHTML;
    }

    function humanize(str) {
      return str.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    const ALL_STATUSES = ['active', 'on hold', 'paused', 'backlog', 'done'];

    function renderProjectsFromToggles() {
      renderProjects(
        document.getElementById('show-active-only-toggle').checked,
        document.getElementById('show-done-toggle').checked
      );
    }

    function renderProjects(showOnlyActive, showDone) {
      const container = document.getElementById('section-content');
      const visible = allProjects.filter(p => {
        if (showOnlyActive) return ACTIVE_STATUSES.has(p.status);
        if (p.status === 'done') return showDone;
        return true;
      });

      if (visible.length === 0) {
        container.innerHTML = '<p class="empty">No projects to show.</p>';
        return;
      }

      const groups = {};
      for (const p of visible) {
        if (!groups[p.category]) groups[p.category] = [];
        groups[p.category].push(p);
      }

      container.innerHTML = Object.entries(groups).map(([cat, items]) => `
        <div class="project-group">
          <div class="project-group-title">${cat}</div>
          <ul class="project-list">
            ${items.map(p => {
              const folder = p.path.replace(/\/[^/]+\.md$/, '');
              const options = ALL_STATUSES.filter(s => s !== p.status)
                .map(s => `<button class="move-option" data-path="${p.path}" data-status="${s}">${s}</button>`)
                .join('');
              return `<li class="project-item">
                <span class="status-dot status-${p.status.replace(/\s+/g, '-')}"></span>
                <a class="project-name" href="/project.html?path=${encodeURIComponent(folder)}">${p.name}</a>
                <div class="project-move">
                  <span class="move-trigger project-status">${p.status}</span>
                  <div class="move-menu">${options}</div>
                </div>
              </li>`;
            }).join('')}
          </ul>
        </div>
      `).join('');
    }

    // ── Meetings tab ──────────────────────────────────────────────────────────
    function renderMeetings() {
      const container = document.getElementById('section-content');
      container.innerHTML = '<p class="empty">Loading…</p>';

      fetch('/api/meetings')
        .then(r => r.json())
        .then(data => {
          const groups = Object.entries(data).filter(([, items]) => items.length > 0);
          if (!groups.length) {
            container.innerHTML = '<p class="empty">No meetings found.</p>';
            return;
          }
          container.innerHTML = groups.map(([category, items]) => `
            <div class="project-group">
              <div class="project-group-title">${category}</div>
              <ul class="project-list">
                ${items.map(m => `
                  <li class="project-item">
                    <a class="project-name" href="/meeting.html?path=${encodeURIComponent(m.path)}">${m.name}</a>
                  </li>`).join('')}
              </ul>
            </div>
          `).join('');
        });
    }

    // ── Conversations tab ─────────────────────────────────────────────────────
    // Keep in sync with the same maps in project.html.
    const CONV_TYPE_LABELS   = { question: 'Question', reference: 'Reference', 'customer-request': 'Customer Request', idea: 'Idea' };
    const CONV_STATUS_LABELS = { unanswered: 'Unanswered', answered: 'Answered', saved: 'Saved', open: 'Open' };
    let allConversations  = [];
    let convTypeFilter    = '';
    let convStatusFilter  = '';
    // Per-viewer preference; never leaves this browser, so localStorage is the right home.
    let convHideAnswered  = false;
    try { convHideAnswered = !!localStorage.getItem('mkd.convHideAnswered'); } catch {}

    function convRowHTML(entry) {
      return `<li class="conv-row">
        <div class="conv-row-main">
          <div class="conv-row-badges">
            <span class="conv-badge conv-type-${esc(entry.type)}">${esc(CONV_TYPE_LABELS[entry.type] || entry.type)}</span>
            <span class="conv-badge conv-status-${esc(entry.status)}">${esc(CONV_STATUS_LABELS[entry.status] || entry.status)}</span>
            ${entry.projectName ? `<span class="conv-meta">${esc(entry.projectName)}</span>` : ''}
          </div>
          <a class="conv-excerpt" href="${esc(entry.permalink || '#')}" target="_blank" rel="noopener noreferrer">${esc(entry.excerpt || '(no excerpt)')}</a>
          <div class="conv-meta">${esc(entry.channel || '')}${entry.author ? ' · ' + esc(entry.author) : ''}${entry.source === 'inbox' ? ' · filed' : ''}</div>
          ${entry.captureNote ? `<div class="conv-note"><div class="conv-note-label">Filed with</div><div class="conv-note-text">${esc(entry.captureNote)}</div></div>` : ''}
          ${entry.notes ? `<div class="conv-note"><div class="conv-note-label">Notes</div><div class="conv-note-text">${esc(entry.notes)}</div></div>` : ''}
        </div>
      </li>`;
    }

    function renderConversationsList() {
      const container = document.getElementById('section-content');
      let items = allConversations.slice();
      if (convTypeFilter)   items = items.filter(c => c.type === convTypeFilter);
      if (convStatusFilter) items = items.filter(c => c.status === convStatusFilter);
      if (convHideAnswered) items = items.filter(c => c.status !== 'answered');
      items.sort((a, b) => (b.lastUpdated || '').localeCompare(a.lastUpdated || ''));

      const rows = items.length
        ? `<ul class="conv-list">${items.map(convRowHTML).join('')}</ul>`
        : '<p class="empty">No conversations match these filters.</p>';

      container.innerHTML = `
        <div class="conv-filter-bar">
          <select id="conv-type-filter" class="task-filter-select">
            <option value="">all types</option>
            <option value="question">Questions</option>
            <option value="idea">Ideas</option>
            <option value="reference">Reference</option>
            <option value="customer-request">Customer Requests</option>
          </select>
          <select id="conv-status-filter" class="task-filter-select">
            <option value="">all statuses</option>
            <option value="open">Open</option>
            <option value="unanswered">Unanswered</option>
            <option value="answered">Answered</option>
            <option value="saved">Saved</option>
          </select>
          <button class="conv-quick-filter" id="conv-quick-unanswered" title="Show unanswered questions">Unanswered questions</button>
          <label class="conv-hide-answered"><input type="checkbox" id="conv-hide-answered"${convHideAnswered ? ' checked' : ''}> Hide answered</label>
        </div>
        ${rows}
      `;

      document.getElementById('conv-type-filter').value = convTypeFilter;
      document.getElementById('conv-status-filter').value = convStatusFilter;
      document.getElementById('conv-type-filter').addEventListener('change', e => {
        convTypeFilter = e.target.value;
        renderConversationsList();
      });
      document.getElementById('conv-status-filter').addEventListener('change', e => {
        convStatusFilter = e.target.value;
        renderConversationsList();
      });
      document.getElementById('conv-hide-answered').addEventListener('change', e => {
        convHideAnswered = e.target.checked;
        try { localStorage.setItem('mkd.convHideAnswered', convHideAnswered ? '1' : ''); } catch {}
        renderConversationsList();
      });
      document.getElementById('conv-quick-unanswered').addEventListener('click', () => {
        convTypeFilter = 'question';
        convStatusFilter = 'unanswered';
        renderConversationsList();
      });
    }

    function renderConversations() {
      const container = document.getElementById('section-content');
      container.innerHTML = '<p class="empty">Loading…</p>';

      fetch('/api/conversations')
        .then(r => r.json())
        .then(all => {
          allConversations = all;
          renderConversationsList();
        });
    }

    // ── Tab switching ─────────────────────────────────────────────────────────
    let activeTab = 'projects';

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.getElementById('show-active-only-label').style.display = tab === 'projects' ? 'flex' : 'none';
      document.getElementById('show-done-label').style.display = tab === 'projects' ? 'flex' : 'none';
      document.getElementById('new-project-btn').style.display = tab === 'projects' ? 'inline-flex' : 'none';

      if (tab === 'projects') {
        renderProjectsFromToggles();
      } else if (tab === 'meetings') {
        renderMeetings();
      } else if (tab === 'conversations') {
        renderConversations();
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.getElementById('show-active-only-toggle').addEventListener('change', () => {
      if (activeTab === 'projects') renderProjectsFromToggles();
    });
    document.getElementById('show-done-toggle').addEventListener('change', () => {
      if (activeTab === 'projects') renderProjectsFromToggles();
    });

    // Initial load
    fetch('/api/projects')
      .then(r => r.json())
      .then(data => {
        allProjects = data;
        switchTab('projects');
        populateProjectFilter();
        populateTaskModalProjects();
      });

    // ── Tasks ─────────────────────────────────────────────────────────────────
    function projectPathFor(p) {
      return p.path.replace(/\/[^/]+\.md$/, '');
    }

    function projectNameFor(projectPath) {
      const p = allProjects.find(pr => projectPathFor(pr) === projectPath);
      return p ? p.name : projectPath;
    }

    let tasksData = null;
    let taskById  = {};

    function applyFilters(tasks) {
      let result = tasks;
      const activity = document.getElementById('activity-filter').value;
      if (activity)
        result = result.filter(t => Array.isArray(t.activity) && t.activity.includes(activity));
      const project = document.getElementById('project-filter').value;
      if (project)
        result = result.filter(t => t.project === project);
      return result;
    }

    function rerenderTasks() {
      if (!tasksData) return;
      const tasks = [...applyFilters(tasksData.today), ...applyFilters(tasksData.backlog)];
      renderKanbanBoard({
        containerEl: document.getElementById('tasks-content'),
        tasks,
        projectNameFor,
        onDrop: changeTaskStatus,
        onEdit: openTaskModal,
      });
    }

    function populateProjectFilter() {
      const sel = document.getElementById('project-filter');
      const current = sel.value;
      sel.innerHTML = '<option value="">all projects</option>' +
        allProjects.map(p => `<option value="${esc(projectPathFor(p))}">${esc(p.name)}</option>`).join('');
      sel.value = current;
    }

    function populateTaskModalProjects(selected = '') {
      const sel = document.getElementById('task-modal-project');
      sel.innerHTML = '<option value="">&mdash; none &mdash;</option>' +
        allProjects.map(p => `<option value="${esc(projectPathFor(p))}">${esc(p.name)}</option>`).join('');
      sel.value = selected;
    }

    document.getElementById('activity-filter').addEventListener('change', rerenderTasks);
    document.getElementById('project-filter').addEventListener('change', rerenderTasks);

    function changeTaskStatus(taskId, status) {
      fetch(`/api/tasks/${encodeURIComponent(taskId)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      })
        .then(r => r.json())
        .then(() => fetchTasks())
        .catch(err => console.error('[tasks] status change failed:', err));
    }

    function fetchTasks() {
      return fetch('/api/tasks')
        .then(r => r.json())
        .then(data => {
          console.log('[tasks]', data);
          if (!data.connected) {
            if (data.error) {
              document.querySelectorAll('.placeholder-msg').forEach(el => el.textContent = 'Could not load tasks');
              document.querySelectorAll('.placeholder-hint').forEach(el => el.textContent = data.error);
            }
            return;
          }
          tasksData = data;
          const allTasks = [...(data.today ?? []), ...(data.backlog ?? [])];
          taskById = Object.fromEntries(allTasks.map(t => [t.id, t]));
          rerenderTasks();
        })
        .catch(err => console.error('[tasks] fetch failed:', err));
    }

    fetchTasks();

    // ── Move-to (status change) ───────────────────────────────────────────────
    const sectionContent = document.getElementById('section-content');

    sectionContent.addEventListener('click', e => {
      const trigger = e.target.closest('.move-trigger');
      const option  = e.target.closest('.move-option');

      if (trigger) {
        e.stopPropagation();
        const menu = trigger.nextElementSibling;
        const isOpen = menu.classList.contains('open');
        document.querySelectorAll('.move-menu.open').forEach(m => m.classList.remove('open'));
        if (!isOpen) menu.classList.add('open');
        return;
      }

      if (option) {
        e.stopPropagation();
        const { path, status } = option.dataset;
        fetch('/api/project-status', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path, status }),
        })
          .then(r => r.json())
          .then(data => {
            if (!data.ok) throw new Error(data.error);
            const proj = allProjects.find(p => p.path === path);
            if (proj) proj.status = status;
            renderProjectsFromToggles();
          })
          .catch(err => alert(`Error: ${err.message}`));
        return;
      }
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.move-menu.open').forEach(m => m.classList.remove('open'));
    });

    // ── New project modal ─────────────────────────────────────────────────────
    const overlay     = document.getElementById('new-project-overlay');
    const nameInput   = document.getElementById('new-project-name');
    const groupSelect = document.getElementById('new-project-group');

    function toKebab(str) {
      return str.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function openNewProjectModal() {
      nameInput.value = '';
      overlay.classList.add('open');
      nameInput.focus();
    }

    function closeNewProjectModal() {
      overlay.classList.remove('open');
    }

    document.getElementById('new-project-btn').addEventListener('click', openNewProjectModal);
    document.getElementById('new-project-cancel').addEventListener('click', closeNewProjectModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeNewProjectModal(); });

    document.getElementById('new-project-submit').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }

      const folder   = toKebab(name);
      const prefix   = groupSelect.value;
      const relPath  = `${prefix}${folder}/README.md`;
      const submitBtn = document.getElementById('new-project-submit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating…';

      try {
        const res = await fetch('/api/project-file', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ root: 'projects', path: relPath, name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');

        closeNewProjectModal();
        // Reload projects list
        const projects = await fetch('/api/projects').then(r => r.json());
        allProjects = projects;
        renderProjectsFromToggles();
      } catch (err) {
        alert(`Error: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
      }
    });

    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('new-project-submit').click();
      if (e.key === 'Escape') closeNewProjectModal();
    });

    // ── Task modal ────────────────────────────────────────────────────────────
    let editingTaskId = null;

    function buildTaskActivityPills(selected = []) {
      document.getElementById('task-modal-activity').innerHTML = wsActivityTypes.map(a =>
        `<label class="pill-toggle">` +
        `<input type="checkbox" value="${a}"${selected.includes(a) ? ' checked' : ''} />` +
        `<span>${a}</span></label>`
      ).join('');
    }

    function openTaskModal(taskId = null) {
      editingTaskId = taskId;
      const t = taskId ? taskById[taskId] : null;
      document.getElementById('task-modal-title').textContent = t ? 'Edit Task' : 'New Task';
      document.getElementById('task-modal-name').value    = t ? t.title : '';
      document.getElementById('task-modal-status').value  = t ? (t.status ?? 'Backlog') : 'Backlog';
      populateTaskModalProjects(t ? (t.project ?? '') : '');
      buildTaskActivityPills(t ? (t.activity ?? []) : []);
      document.getElementById('task-modal-delete').hidden = !taskId;
      document.getElementById('task-modal-overlay').classList.add('open');
      document.getElementById('task-modal-name').focus();
    }

    function closeTaskModal() {
      document.getElementById('task-modal-overlay').classList.remove('open');
      editingTaskId = null;
    }

    document.getElementById('task-new-btn').addEventListener('click', () => openTaskModal());
    document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
    document.getElementById('task-modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('task-modal-overlay')) closeTaskModal();
    });

    document.getElementById('task-modal-delete').addEventListener('click', async () => {
      if (!editingTaskId) return;
      if (!confirm('Delete this task?')) return;
      const btn = document.getElementById('task-modal-delete');
      btn.disabled = true;
      try {
        await fetch(`/api/tasks/${encodeURIComponent(editingTaskId)}`, { method: 'DELETE' });
        closeTaskModal();
        await fetchTasks();
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('task-modal-submit').addEventListener('click', async () => {
      const name    = document.getElementById('task-modal-name').value.trim();
      if (!name) { document.getElementById('task-modal-name').focus(); return; }
      const status  = document.getElementById('task-modal-status').value;
      const project = document.getElementById('task-modal-project').value || null;
      const activity = [...document.querySelectorAll('#task-modal-activity input:checked')].map(el => el.value);

      const btn = document.getElementById('task-modal-submit');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (editingTaskId) {
          await fetch(`/api/tasks/${encodeURIComponent(editingTaskId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: name, status, project, activity }),
          });
        } else {
          await fetch('/api/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: name, status, project, activity }),
          });
        }
        closeTaskModal();
        await fetchTasks();
      } finally {
        btn.disabled = false; btn.textContent = 'Save';
      }
    });

    // ── Quote footer ──────────────────────────────────────────────────────────
    let quoteIndex = Math.floor(Math.random() * QUOTES.length);

    function showQuote(q) {
      document.getElementById('quote-text').textContent = q.text;
      const attr = document.getElementById('quote-attr');
      attr.textContent = q.author ? '— ' + q.author : '';
    }

    showQuote(QUOTES[quoteIndex]);

    setInterval(() => {
      const footer = document.getElementById('quote-footer');
      footer.classList.add('fade-out');
      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
        showQuote(QUOTES[quoteIndex]);
        footer.classList.remove('fade-out');
      }, 500);
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
